[package]
name = "lwk"
description = "Flutter-Rust Bridge for Liquid Wallet Kit (lwk)"
authors = ["i5hi <ishi@satoshiportal.com>, mocodesmo <morteza@satoshiportal.com>"]
version = "0.3.0"
edition = "2021"

[lib]
name = "lwk"
doctest = false
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
# Pin the rustls crypto provider to ring; both ring + aws-lc-rs are linked
# transitively in the bull_sdk aggregate, which makes rustls 0.23 panic when it
# tries to auto-pick a default. We install ring explicitly at runtime.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
lwk_wollet = {version = "0.18.0" }
lwk_signer = { version = "0.18.0" }
lwk_common = {version = "0.18.0" }
thiserror = "2.0.18"
flutter_rust_bridge = "=2.12.0"
anyhow = "1.0.68"
lazy_static = "1.5.0"
hex = "0.4"
log = "0.4.22"
zeroize = "1.8"
sideswap_types = { git = "https://github.com/sideswap-io/sideswap_rust.git", rev = "3722a83da1c440c8a8c8edc79b7dc89ed01ae11c" }
sideswap_common = { git = "https://github.com/sideswap-io/sideswap_rust.git", rev = "3722a83da1c440c8a8c8edc79b7dc89ed01ae11c" }
sideswap_payjoin = { git = "https://github.com/sideswap-io/sideswap_rust.git", rev = "3722a83da1c440c8a8c8edc79b7dc89ed01ae11c" }

[features]
bull_sdk = []

[build-dependencies]
flutter_rust_bridge_codegen = { version = "=2.12.0" }

[build]
profiler = true

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[target.'cfg(target_os = "macos")']
rustflags = [
    "-C", "link-arg=-undefined",
    "-C", "link-arg=dynamic_lookup",
]
